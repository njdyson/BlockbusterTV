name: Build APK

# Builds the debug APK on every push and publishes it to the "apk-latest" release,
# so a Fire Stick can always fetch the newest build from one fixed URL:
# https://github.com/njdyson/BlockbusterTV/releases/latest/download/BlockbusterTV.apk
on:
  push:
    branches: [main, link-lab]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  # Never cancel mid-publish: the release is deleted and recreated in the last step.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
        env:
          # Optional: enables trailers. Add it under Settings > Secrets and variables > Actions.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk BlockbusterTV.apk
      # Read by the app's "Check for update" button.
      - run: |
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"sha\": \"${GITHUB_SHA::7}\"}" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: BlockbusterTV-apk
          path: BlockbusterTV.apk
      - name: Publish to apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest BlockbusterTV.apk version.json \
            --title "Latest APK" \
            --notes "Build ${GITHUB_RUN_NUMBER}, from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" \
            --latest
