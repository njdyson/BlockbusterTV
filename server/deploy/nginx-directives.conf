# Paste into Plesk: Websites & Domains > blockbuster.psybob.uk > Apache & nginx Settings >
# "Additional nginx directives". It sends everything for the subdomain to PocketBase.
# (A regex location is used because Plesk already defines "location /"; Plesk's own
# Let's Encrypt location still takes priority, so certificate renewals keep working.)
location ~ ^/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 360s;
    proxy_buffering off;
    client_max_body_size 10m;
}
